<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gretelikner</title>

  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Gretelikner" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Армянские шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600;800;900&family=Mardoto:wght@400;500;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <style>
    :root {
      --bg-grad: radial-gradient(ellipse at 80% 10%,
          #fff4d0 0%, #c9e3ff 35%, #7fb1e8 75%, #4a7fbf 100%);
      --text: #1f2a4a;
      --muted: #5a6890;
      --card-bg: rgba(255, 255, 255, 0.85);
      --gradient-text: #00baff;
      --shadow-dreamy: 0 30px 80px -20px rgba(60, 90, 180, 0.35),
        0 10px 30px -10px rgba(90, 140, 200, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Mardoto', sans-serif;
      color: var(--text);
      background: var(--bg-grad);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16rem 1rem;
      overflow: hidden;
    }

    .aurora {
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 180deg at 50% 50%,
          #bfd6ff, #d4ecff, #d3c7ff, #e1f1ff, #bfd6ff);
      filter: blur(80px);
      opacity: 0.55;
      animation: aurora-spin 30s linear infinite;
      pointer-events: none;
    }

    @keyframes aurora-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .sun {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 220px;
      height: 220px;
      pointer-events: none;
    }

    .sun-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 220, 120, 0.55), transparent 65%);
      filter: blur(20px);
      animation: sun-pulse 4s ease-in-out infinite;
    }

    .sun-rays {
      position: absolute;
      inset: 0;
      animation: sun-spin 40s linear infinite;
      transform-origin: center;
    }

    .sun-body {
      position: absolute;
      inset: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe07a 0%, #ffc24a 70%, #f59c2a 100%);
      box-shadow: 0 0 60px rgba(255, 200, 80, 0.9),
        0 0 120px rgba(255, 180, 60, 0.55);
      animation: sun-pulse 3s ease-in-out infinite;
    }

    .sun-face {
      position: absolute;
      inset: 0;
    }

    @keyframes sun-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sun-pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    .stars,
    .shooting-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      /* белая точка */
      position: absolute;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 8px white, 0 0 16px #bcd4ff;
      animation: twinkle 3s ease-in-out infinite;
    }

    .star.shape {
      /* SVG-звёздочка */
      background: none;
      box-shadow: none;
      color: #fff8d0;
      filter: drop-shadow(0 0 6px rgba(255, 230, 120, 0.8));
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .shoot {
      position: absolute;
      left: 0;
      width: 6px;
      height: 6px;
      background: linear-gradient(90deg, transparent, #fff, #bcd4ff);
      border-radius: 9999px;
      filter: drop-shadow(0 0 6px #fff);
      opacity: 0;
    }

    @keyframes shoot {
      0% {
        transform: translateX(-10vw) translateY(0) rotate(-20deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateX(110vw) translateY(40vh) rotate(-20deg);
        opacity: 0;
      }
    }

    .cloud {
      position: absolute;
      pointer-events: none;
      opacity: 0.85;
    }

    .cloud-1 {
      top: 6rem;
      left: 2rem;
      width: 120px;
      animation: float-slow 8s ease-in-out infinite;
    }

    .cloud-2 {
      bottom: 4rem;
      right: 25%;
      width: 90px;
      animation: float-medium 6s ease-in-out infinite;
    }

    @keyframes float-slow {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(10px, -20px);
      }
    }

    @keyframes float-medium {

      0%,
      100% {
        transform: translate(0, 0) rotate(0);
      }

      50% {
        transform: translate(0, -30px) rotate(8deg);
      }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 640px;
      padding: 3.5rem 2.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2rem;
      box-shadow: var(--shadow-dreamy);
      text-align: center;
      animation: card-in 1s cubic-bezier(0.16, 1, 0.3, 1) both,
        glow-pulse 4s ease-in-out infinite;
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
    }

    @keyframes card-in {
      0% {
        opacity: 0;
        transform: translateY(60px) scale(.9);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes glow-pulse {

      0%,
      100% {
        box-shadow: 0 0 40px rgba(140, 180, 255, 0.4), 0 0 80px rgba(160, 180, 255, 0.2);
      }

      50% {
        box-shadow: 0 0 60px rgba(140, 180, 255, 0.6), 0 0 120px rgba(160, 180, 255, 0.35);
      }
    }

    .hero {
      width: 260px;
      margin: -120px auto 0;
      display: block;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.25));
      animation: float-medium 6s ease-in-out infinite;
    }

    .ribbon {
      display: inline-block;
      margin: 1rem 0 1.5rem;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      color: white;
      font-family: 'Noto Serif Armenian', serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00abed, #00b9f8 12.5%, #00c0fe, #29c6ff, #42ccff, #54d2ff 37.5%, #73deff, #54d2ff 62.5%, #42ccff, #29c6ff, #00c0fe, #00b9f8 87.5%, #00abed) 0 0/200% 100%;
      background-size: 200% 100%;
      animation: ribbon-shine 4s linear infinite;
    }

    @keyframes ribbon-shine {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .title {
      font-family: 'Noto Serif Armenian', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .title span {
      display: inline-block;
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: #0091ff !important;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    /* Анимация букв задаётся через style="animation-delay:..." в JS */
    @keyframes letter-in {
      0% {
        opacity: 0;
        transform: translateY(40px) rotate(-8deg) scale(0.5);
        filter: blur(10px);
      }

      100% {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    .lead {
      font-style: italic;
      font-size: 1.3rem;
      margin: 1rem 0 1.5rem;
      opacity: 0.85;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .closing {
      background: var(--gradient-text);
      color: #0000;
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: 4s ease-in-out infinite shimmer-text;
    }

    @keyframes shimmer-text {

      0%,
      100% {
        background-position: 0%;
      }

      50% {
        background-position: 100%;
      }
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .details {
        grid-template-columns: 1fr;
      }
    }

    .detail {
      padding: 1rem;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, #fff, #e5f1ff);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 12px rgba(120, 160, 210, 0.1);
      transition: transform .25s, box-shadow .25s;
    }

    .detail:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(120, 160, 210, 0.25);
    }

    .detail .emoji {
      font-size: 2rem;
      animation: bounce 2.5s ease-in-out infinite;
      display: inline-block;
    }

    .detail .emoji img {
      width: 50%;
    }

    .detail .lbl {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .detail .val {
      font-family: 'Noto Serif Armenian', serif;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    .swatches {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .swatches span {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
  </style>

  <main class="stage">

    <!-- Аврора-фон (вращающийся градиент) -->
    <div class="aurora"></div>

    <!-- СОЛНЫШКО с лучами -->
    <div class="sun">
      <div class="sun-glow"></div>
      <svg class="sun-rays" viewBox="0 0 200 200">
        <!-- 16 лучей через JS, см. script.js -->
      </svg>
      <div class="sun-body">
        <svg viewBox="0 0 100 100" class="sun-face">
          <circle cx="36" cy="42" r="4" fill="#3d2a10" />
          <circle cx="64" cy="42" r="4" fill="#3d2a10" />
          <path d="M32 58 Q50 74 68 58" stroke="#3d2a10" stroke-width="4" fill="none" stroke-linecap="round" />
          <circle cx="26" cy="56" r="5" fill="#f0a090" opacity="0.6" />
          <circle cx="74" cy="56" r="5" fill="#f0a090" opacity="0.6" />
        </svg>
      </div>
    </div>

    <!-- Звёзды (генерируются JS-ом) -->
    <div class="stars" id="stars"></div>

    <!-- Падающие звёзды -->
    <div class="shooting-stars" id="shooting"></div>

    <!-- Облака -->
    <svg class="cloud cloud-1" viewBox="0 0 100 60" fill="white">
      <ellipse cx="30" cy="40" rx="22" ry="18" />
      <ellipse cx="55" cy="32" rx="26" ry="22" />
      <ellipse cx="78" cy="42" rx="18" ry="15" />
    </svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 60" fill="white">
      <ellipse cx="30" cy="40" rx="22" ry="18" />
      <ellipse cx="55" cy="32" rx="26" ry="22" />
      <ellipse cx="78" cy="42" rx="18" ry="15" />
    </svg>

    <!-- КАРТОЧКА -->
    <article class="card" id="card">
      <img class="hero" src="graduation.png" alt="Փոքրիկ շրջանավարտներ" />

      <span class="ribbon">Գրետելիկներ • 2026</span>

      <h1 class="title" id="title"></h1>

      <p class="lead">Սիրով հրավիրում ենք</p>
      <p class="sub">«<b>Գրետելիկներում</b>» կայանալիք<br>ավարտական հանդեսին</p>

      <div class="details">
        <div class="detail">
          <div class="emoji"><img src="calendar.webp" alt="" loading="lazy"></div>
          <div class="lbl">Օր</div>
          <div class="val">13.06.2026</div>
        </div>
        <div class="detail">
          <div class="emoji"><img src="thime.webp" alt="" loading="lazy"></div>
          <div class="lbl">Ժամ</div>
          <div class="val">10:00</div>
        </div>
        <div class="detail">
          <div class="emoji"><img src="dresscode.png" alt="" loading="lazy"></div>
          <div class="lbl">Դրես-կոդ</div>
          <div class="val">Սպիտակ և Երկնագույն</div>
        </div>
      </div>

      <div class="swatches">
        <span style="background:#fff"></span>
        <span style="background:#7cc4ff"></span>
      </div>

      <p class="closing">Սիրով սպասում ենք Ձեզ ✨</p>
    </article>
  </main>

  <script>
    const rays = document.querySelector('.sun-rays');
    for (let i = 0; i < 16; i++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', '98'); r.setAttribute('y', '6');
      r.setAttribute('width', '4'); r.setAttribute('height', '34'); r.setAttribute('rx', '2');
      r.setAttribute('fill', '#ffd86b'); r.setAttribute('opacity', '0.85');
      r.setAttribute('transform', `rotate(${i * 22.5} 100 100)`);
      rays.appendChild(r);
    }

    const starsBox = document.getElementById('stars');
    for (let i = 0; i < 70; i++) {
      const isShape = Math.random() > 0.6;
      const size = 2 + Math.random() * 4;
      const el = document.createElement(isShape ? 'div' : 'span');
      el.className = 'star' + (isShape ? ' shape' : '');
      el.style.top = Math.random() * 100 + '%';
      el.style.left = Math.random() * 100 + '%';
      el.style.width = (isShape ? size * 2 : size) + 'px';
      el.style.height = (isShape ? size * 2 : size) + 'px';
      el.style.animationDelay = (Math.random() * 4) + 's';
      el.style.animationDuration = (2 + Math.random() * 3) + 's';
      if (isShape) el.innerHTML =
        `<svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%">
       <path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/>
     </svg>`;
      starsBox.appendChild(el);
    }

    // 3. Падающие звёзды (4 шт.)
    const shootBox = document.getElementById('shooting');
    for (let i = 0; i < 4; i++) {
      const s = document.createElement('span');
      s.className = 'shoot';
      s.style.top = (5 + Math.random() * 40) + '%';
      s.style.animation = `shoot ${1.6 + Math.random() * 1.4}s ease-in ${i * 3 + Math.random() * 4}s infinite`;
      shootBox.appendChild(s);
    }

    // 4. Побуквенный заголовок
    const TITLE = 'Ավարտական Հանդես';
    const h = document.getElementById('title');
    if (h) {
      h.innerHTML = TITLE.split('').map((ch, i) =>
        ch === ' ' ? '<br>' : `<span style="display:inline-block;animation:letter-in 0.8s cubic-bezier(0.16,1,0.3,1) ${i * 0.05}s both, shimmer 4s ease-in-out ${i * 0.05}s infinite">${ch}</span>`
      ).join('');
    }

    // 5. 3D-наклон карточки от мыши
    const card = document.getElementById('card');
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(1200px) rotateX(${-py * 6}deg) rotateY(${px * 6}deg)`;
    });
    card.addEventListener('mouseleave', () => card.style.transform = '');
  </script>

</body>

</html>
