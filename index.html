<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gretelikner</title>

  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Gretelikner" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600;800;900&family=Mardoto:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Скомпилированный CSS (замените на ваш путь) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <!-- Аврора -->
    <div class="aurora"></div>

    <!-- Солнце -->
    <div class="sun">
      <div class="sun-glow"></div>
      <svg class="sun-rays" viewBox="0 0 200 200"></svg>
      <div class="sun-body">
        <svg viewBox="0 0 100 100" class="sun-face">
          <circle cx="36" cy="42" r="4" fill="#3d2a10" />
          <circle cx="64" cy="42" r="4" fill="#3d2a10" />
          <path d="M32 58 Q50 74 68 58" stroke="#3d2a10" stroke-width="4" fill="none" stroke-linecap="round" />
          <circle cx="26" cy="56" r="5" fill="#f0a090" opacity="0.6" />
          <circle cx="74" cy="56" r="5" fill="#f0a090" opacity="0.6" />
        </svg>
      </div>
    </div>

    <!-- Облака -->
    <svg class="cloud cloud-1" viewBox="0 0 100 60" fill="white">
      <ellipse cx="30" cy="40" rx="22" ry="18" />
      <ellipse cx="55" cy="32" rx="26" ry="22" />
      <ellipse cx="78" cy="42" rx="18" ry="15" />
    </svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 60" fill="white">
      <ellipse cx="30" cy="40" rx="22" ry="18" />
      <ellipse cx="55" cy="32" rx="26" ry="22" />
      <ellipse cx="78" cy="42" rx="18" ry="15" />
    </svg>

    <!-- Карточка -->
    <article class="card" id="card">
      <img class="hero" src="graduation.png" alt="Փոքրիկ շրջանավարտներ" />

      <span class="ribbon">Գրետելիկներ • 2026</span>

      <h1 class="title" id="title"></h1>

      <p class="lead">Սիրով հրավիրում ենք</p>
      <p class="sub">«<b>Գրետելիկներում</b>» կայանալիք<br>ավարտական հանդեսին</p>

      <div class="details">
        <div class="detail">
          <div class="emoji"><img src="calendar.webp" alt="" loading="lazy"></div>
          <div class="lbl">Օր</div>
          <div class="val">13.06.2026</div>
        </div>
        <div class="detail">
          <div class="emoji"><img src="thime.webp" alt="" loading="lazy"></div>
          <div class="lbl">Ժամ</div>
          <div class="val">10:00</div>
        </div>
        <div class="detail">
          <div class="emoji"><img src="dresscode.png" alt="" loading="lazy"></div>
          <div class="lbl">Դրես-կոդ</div>
          <div class="val">Սպիտակ և Երկնագույն</div>
        </div>
      </div>

      <div class="swatches">
        <span style="background:#fff"></span>
        <span style="background:#7cc4ff"></span>
      </div>

      <p class="closing">Սիրով սպասում ենք Ձեզ ✨</p>
    </article>
  </main>

  <script>
    // Лучи солнца
    const rays = document.querySelector('.sun-rays');
    for (let i = 0; i < 16; i++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', '98');
      r.setAttribute('y', '6');
      r.setAttribute('width', '4');
      r.setAttribute('height', '34');
      r.setAttribute('rx', '2');
      r.setAttribute('fill', '#ffd86b');
      r.setAttribute('opacity', '0.85');
      r.setAttribute('transform', `rotate(${i * 22.5} 100 100)`);
      rays.appendChild(r);
    }

    // Статические звёзды
    function createStars() {
      const stage = document.querySelector('.stage');
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = (Math.random() * 3 + 1) + 'px';
        star.style.height = star.style.width;
        star.style.opacity = 0.3 + Math.random() * 0.5;
        stage.appendChild(star);
      }
    }

    // Анимация букв
    const TITLE = 'Ավարտական Հանդես';
    const h = document.getElementById('title');
    if (h) {
      h.innerHTML = TITLE.split('').map((ch, i) =>
        ch === ' ' ? '<br>' : `<span style="display:inline-block;animation:letter-in 0.8s cubic-bezier(0.16,1,0.3,1) ${i * 0.05}s both">${ch}</span>`
      ).join('');
    }

    // 3D-эффект карточки с throttle
    const card = document.getElementById('card');
    let isTicking = false;
    
    card.addEventListener('mousemove', (e) => {
      if (isTicking) return;
      isTicking = true;
      
      requestAnimationFrame(() => {
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        card.style.transform = `perspective(1200px) rotateX(${-py * 4}deg) rotateY(${px * 4}deg)`;
        isTicking = false;
      });
    });
    
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
      isTicking = false;
    });

    createStars();
  </script>
</body>
</html>
